services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hybridrag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hybridrag
      POSTGRES_PASSWORD: hybridrag
      POSTGRES_DB: hybridrag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
